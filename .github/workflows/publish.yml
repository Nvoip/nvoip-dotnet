name: Publish package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to NuGet after validation
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  nuget:
    name: Publish to NuGet
    runs-on: [self-hosted, Linux, X64, nvoip-ci-public-release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore src/Nvoip/Nvoip.csproj
      - run: dotnet pack src/Nvoip/Nvoip.csproj --configuration Release --output artifacts
      - if: github.event_name == 'release' || inputs.publish
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
